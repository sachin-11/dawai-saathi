<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1512" viewBox="0 0 1080 1512" font-family="'Segoe UI', Arial, sans-serif"><rect width="1080" height="1512" fill="#0b1220"/><text x="540" y="62" font-size="38" fill="#f1f5f9" font-weight="800" text-anchor="middle">Data flow: one prescription photo</text><text x="540" y="94" font-size="20" fill="#a8b5c9" font-weight="500" text-anchor="middle">from WhatsApp to a reply, step by step</text><rect x="40" y="130" width="1000" height="77" rx="14" fill="#111a2e" stroke="#25d366" stroke-width="2"/><circle cx="86" cy="168.5" r="22" fill="#25d366"/><text x="86" y="176.5" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">1</text><text x="130" y="164" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">User sends a prescription photo</text><text x="130" y="191" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">No app install. Just a photo in the chat.</text><rect x="926" y="118" width="100" height="26" rx="13" fill="#0b1220" stroke="#25d366" stroke-width="1.5"/><text x="976" y="136" font-size="14" fill="#25d366" font-weight="700" text-anchor="middle">WhatsApp</text><line x1="86" y1="221" x2="86" y2="265" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="243" width="1000" height="102" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="2"/><circle cx="86" cy="294" r="22" fill="#3b82f6"/><text x="86" y="302" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">2</text><text x="130" y="277" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Webhook receives it (answers in under 1 s)</text><text x="130" y="304" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Checks Meta's signature (HMAC), drops duplicates, checks consent.</text><text x="130" y="329" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Saves the message row and puts a job in the Redis queue (ids only, no text).</text><rect x="935" y="231" width="91" height="26" rx="13" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/><text x="980.5" y="249" font-size="14" fill="#3b82f6" font-weight="700" text-anchor="middle">Gateway</text><line x1="86" y1="359" x2="86" y2="403" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="381" width="1000" height="102" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="2"/><circle cx="86" cy="432" r="22" fill="#3b82f6"/><text x="86" y="440" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">3</text><text x="130" y="415" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Worker says "reading... 20-30 sec", then stores the image</text><text x="130" y="442" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Downloads the photo from Meta into a private, encrypted S3 bucket.</text><text x="130" y="467" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Makes a 5-minute presigned link for the AI service.</text><rect x="890" y="369" width="136" height="26" rx="13" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/><text x="958" y="387" font-size="14" fill="#3b82f6" font-weight="700" text-anchor="middle">Gateway + S3</text><line x1="86" y1="497" x2="86" y2="541" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="519" width="1000" height="102" rx="14" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/><circle cx="86" cy="570" r="22" fill="#a78bfa"/><text x="86" y="578" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">4</text><text x="130" y="553" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Gateway calls the AI service (service token)</text><text x="130" y="580" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Sends the link + the user's active medicines (for interaction checks).</text><text x="130" y="605" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Emergency rules never run on text read from an image.</text><rect x="908" y="507" width="118" height="26" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/><text x="967" y="525" font-size="14" fill="#a78bfa" font-weight="700" text-anchor="middle">AI service</text><line x1="86" y1="635" x2="86" y2="679" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="657" width="1000" height="127" rx="14" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/><circle cx="86" cy="720.5" r="22" fill="#a78bfa"/><text x="86" y="728.5" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">5</text><text x="130" y="691" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Image is cleaned, classified and read</text><text x="130" y="718" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Resize, strip EXIF/GPS, check blur. Prescription or lab report?</text><text x="130" y="743" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Vision model returns strict JSON with a confidence per field.</text><text x="130" y="768" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Rules overrule the model (e.g. "1-0-1", "after food").</text><rect x="890" y="645" width="136" height="26" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/><text x="958" y="663" font-size="14" fill="#a78bfa" font-weight="700" text-anchor="middle">Vision model</text><line x1="86" y1="798" x2="86" y2="842" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="820" width="1000" height="127" rx="14" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/><circle cx="86" cy="883.5" r="22" fill="#f59e0b"/><text x="86" y="891.5" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">6</text><text x="130" y="854" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Medicines are matched to the catalog</text><text x="130" y="881" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Brand name to salt, strength and form (fuzzy match, then vector fallback).</text><text x="130" y="906" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Cheaper generic only if salt + strength + form match exactly.</text><text x="130" y="931" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Interactions and duplicates checked against active medicines.</text><rect x="926" y="808" width="100" height="26" rx="13" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/><text x="976" y="826" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="middle">Postgres</text><line x1="86" y1="961" x2="86" y2="1005" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="983" width="1000" height="102" rx="14" fill="#111a2e" stroke="#2dd4bf" stroke-width="2"/><circle cx="86" cy="1034" r="22" fill="#2dd4bf"/><text x="86" y="1042" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">7</text><text x="130" y="1017" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Reply is built from data only, then verified</text><text x="130" y="1044" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Every medicine must come from the photo or the catalog.</text><text x="130" y="1069" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Unclear items say "confirm with your pharmacist". Disclaimer added.</text><rect x="926" y="971" width="100" height="26" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="976" y="989" font-size="14" fill="#2dd4bf" font-weight="700" text-anchor="middle">Verifier</text><line x1="86" y1="1099" x2="86" y2="1143" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="1121" width="1000" height="127" rx="14" fill="#111a2e" stroke="#3b82f6" stroke-width="2"/><circle cx="86" cy="1184.5" r="22" fill="#3b82f6"/><text x="86" y="1192.5" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">8</text><text x="130" y="1155" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Gateway saves results and sends the reply</text><text x="130" y="1182" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">One DB transaction: document, medicines, warnings.</text><text x="130" y="1207" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Reply goes through the outbound queue (content encrypted) to WhatsApp.</text><text x="130" y="1232" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Buttons: Set reminders · Generic details · Something is wrong</text><rect x="890" y="1109" width="136" height="26" rx="13" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/><text x="958" y="1127" font-size="14" fill="#3b82f6" font-weight="700" text-anchor="middle">Gateway + DB</text><line x1="86" y1="1262" x2="86" y2="1306" stroke="#a8b5c9" stroke-width="2.5" opacity="0.5"/><rect x="40" y="1284" width="1000" height="102" rx="14" fill="#111a2e" stroke="#25d366" stroke-width="2"/><circle cx="86" cy="1335" r="22" fill="#25d366"/><text x="86" y="1343" font-size="24" fill="#0b1220" font-weight="800" text-anchor="middle">9</text><text x="130" y="1318" font-size="20" fill="#f1f5f9" font-weight="700" text-anchor="start">Later: reminders and caregiver alert</text><text x="130" y="1345" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">At each dose time: "Le li / Baad me / Skip".</text><text x="130" y="1370" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="start">Two missed doses in a row: the opted-in caregiver gets a short alert.</text><rect x="917" y="1272" width="109" height="26" rx="13" fill="#0b1220" stroke="#25d366" stroke-width="1.5"/><text x="971.5" y="1290" font-size="14" fill="#25d366" font-weight="700" text-anchor="middle">Reminders</text><rect x="40" y="1416" width="1000" height="70" rx="14" fill="#111a2e" stroke="#2dd4bf" stroke-width="2"/><text x="540" y="1446" font-size="16" fill="#f1f5f9" font-weight="600" text-anchor="middle">Behind all steps: one trace id per message (OpenTelemetry), logs without phone numbers,</text><text x="540" y="1470" font-size="16" fill="#a8b5c9" font-weight="500" text-anchor="middle">rate limits, a daily LLM budget, and dead-letter queues so nothing is lost silently.</text></svg>