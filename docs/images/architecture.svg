" y="1334" width="490" height="30" rx="15" fill="#2a1620" stroke="#f87171" stroke-width="1.2"/><text x="285" y="1354" font-size="15" fill="#f1f5f9" font-weight="500" text-anchor="middle">Low confidence = says so</text><rect x="550" y="1334" width="490" height="30" rx="15" fill="#2a1620" stroke="#f87171" stroke-width="1.2"/><text x="795" y="1354" font-size="15" fill="#f1f5f9" font-weight="500" text-anchor="middle">Generic only on exact salt + strength + form</text><rect x="40" y="1372" width="490" height="30" rx="15" fill="#2a1620" stroke="#f87171" stroke-width="1.2"/><text x="285" y="1392" font-size="15" fill="#f1f5f9" font-weight="500" text-anchor="middle">Phone hashed + encrypted, PHI out of logs</text><rect x="550" y="1372" width="490" height="30" rx="15" fill="#2a1620" stroke="#f87171" stroke-width="1.2"/><text x="795" y="1392" font-size="15" fill="#f1f5f9" font-weight="500" text-anchor="middle">Consent first · DELETE wipes everything</text><text x="540" y="1450" font-size="15" fill="#94a3b8" font-weight="500" text-anchor="middle">TypeScript · Python 3.12 · NestJS · FastAPI · LangGraph · Docker · Jest + pytest + eval harness</text></svg>