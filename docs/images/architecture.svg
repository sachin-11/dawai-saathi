" font-weight="700" text-anchor="middle">Lab report</text><text x="342.5" y="736.5" font-size="15" fill="#94a3b8" font-weight="500" text-anchor="middle">explainer</text><line x1="540" y1="652" x2="540" y2="676" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="455" y="676" width="170" height="84" rx="14" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/><text x="540" y="708.5" font-size="17" fill="#f1f5f9" font-weight="700" text-anchor="middle">Generic</text><text x="540" y="736.5" font-size="15" fill="#94a3b8" font-weight="500" text-anchor="middle">finder</text><line x1="737.5" y1="652" x2="737.5" y2="676" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="652.5" y="676" width="170" height="84" rx="14" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/><text x="737.5" y="708.5" font-size="17" fill="#f1f5f9" font-weight="700" text-anchor="middle">Interaction</text><text x="737.5" y="736.5" font-size="15" fill="#94a3b8" font-weight="500" text-anchor="middle">checker</text><line x1="935" y1="652" x2="935" y2="676" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="850" y="676" width="170" height="84" rx="14" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/><text x="935" y="708.5" font-size="17" fill="#f1f5f9" font-weight="700" text-anchor="middle">Voice</text><text x="935" y="736.5" font-size="15" fill="#94a3b8" font-weight="500" text-anchor="middle">STT → text</text><line x1="145" y1="760" x2="145" y2="786" stroke="#a78bfa" stroke-width="2.5"/><line x1="342.5" y1="760" x2="342.5" y2="786" stroke="#a78bfa" stroke-width="2.5"/><line x1="540" y1="760" x2="540" y2="786" stroke="#a78bfa" stroke-width="2.5"/><line x1="737.5" y1="760" x2="737.5" y2="786" stroke="#a78bfa" stroke-width="2.5"/><line x1="935" y1="760" x2="935" y2="786" stroke="#a78bfa" stroke-width="2.5"/><line x1="145" y1="786" x2="935" y2="786" stroke="#a78bfa" stroke-width="2.5"/><line x1="290" y1="786" x2="290" y2="812" stroke="#a78bfa" stroke-width="2.5" mar