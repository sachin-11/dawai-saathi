# Lab test reference data (M12). SOURCE OF TRUTH for the `lab_tests` table (loaded by
# data/scripts/seed_lab_tests.py) and for the in-memory repository used by tests / evals.
#
# !! NOT CLINICALLY REVIEWED. Ranges and explanations were written from general medical knowledge and
# !! the public references named in each `src` code (see SOURCES below). A doctor / pathologist must
# !! review this file, app/safety/critical_values.yaml and data/review/lab_tests_hi_review.csv before launch.
# !! The reply ALWAYS prefers the range printed on the user's own report; these are only fallbacks.
#
# Source codes (licence notes in data/SOURCES.md; none verified):
#   S1 WHO haemoglobin thresholds for anaemia (WHO/NMH/NHD/MNM/11.1)
#   S2 NCEP ATP III lipid categories (NIH/NHLBI, public domain)
#   S3 Lipid Association of India consensus (2020)
#   S4 ADA Standards of Care in Diabetes (glucose / HbA1c categories)
#   S5 NIH MedlinePlus lab-test pages (NLM) - typical adult ranges
#   S6 NCBI Bookshelf, Clinical Methods (Walker, Hall, Hurst)
#   S7 KDIGO CKD guideline (eGFR categories)
#   S8 ATA 2017 / Indian Thyroid Society (loose TSH / thyroid hormone intervals; assay-specific)
#   S9 Endocrine Society / Indian consensus (vitamin D); B12, folate, iron studies from S5
#
# Format per test:
#   name, section, unit (CANONICAL unit: all comparison against these ranges happens in it),
#   conv: {printed-unit-normalised: factor | {f: factor, o: offset}}  canonical = printed * f + o
#   r: [[sex, age_min, age_max, low, high], ...]   sex any|m|f ; null = open end ; fallback ranges only
#   src: source code(s) for the numbers; ex: explanation (neutral, what the test measures)
#   qual: for qualitative tests, the words that mean "normal"
#   q: optional extra questions for the doctor (English); generic ones are added by the loader
#
# Units are written in "normalised" spelling: lower case, no spaces, micro sign -> u (see lab_normalize).

generic_questions_en:
  - 'What do these results mean for me, given my history?'
  - 'Do I need to repeat any of these tests, and when?'
  - 'Should I change anything before the next check-up, or is it fine to wait?'
generic_questions_hi:
  - 'मेरी हिस्ट्री को देखते हुए इन नतीजों का मेरे लिए क्या मतलब है?'
  - 'क्या इनमें से कोई टेस्ट दोबारा कराना है, और कब?'
  - 'क्या अगले चेक-अप से पहले कुछ बदलना है, या इंतज़ार कर सकता हूँ?'
generic_hi_line: 'इस जाँच का मतलब अपने डॉक्टर से समझें।'

tests:
  # ------------------------------------------------------------------ CBC
  - code: HB
    name: Haemoglobin
    section: CBC
    unit: g/dl
    aliases:
      [hb, hgb, haemoglobin, hemoglobin, haemoglobin hb, hemoglobin hb, hb g/dl, khoon ki matra]
    conv: { g/l: 0.1 }
    r: [[m, 18, null, 13.0, 17.5], [f, 18, null, 12.0, 15.5], [any, 18, null, 12.0, 17.5]]
    src: S1 S5
    ex: 'Haemoglobin is the protein in red blood cells that carries oxygen around the body.'
    q: ['Is there a reason to look into why my haemoglobin value is where it is?']
  - code: TLC
    name: Total leucocyte count (WBC)
    section: CBC
    unit: 10^3/ul
    aliases:
      [
        tlc,
        wbc,
        wbc count,
        total wbc count,
        total leucocyte count,
        total leukocyte count,
        total white blood cell count,
        white blood cells,
        leucocytes,
      ]
    conv:
      {
        /cumm: 0.001,
        /ul: 0.001,
        /mm3: 0.001,
        cells/cumm: 0.001,
        10^9/l: 1,
        thou/cumm: 1,
        thousand/cumm: 1,
        k/ul: 1,
        x10^3/ul: 1,
      }
    r: [[any, 18, null, 4.0, 11.0]]
    src: S5
    ex: 'White blood cells are the cells that help the body fight infection; this counts how many there are.'
  - code: PLT
    name: Platelet count
    section: CBC
    unit: 10^3/ul
    aliases: [plt, platelets, platelet count, platelet, plt count, thrombocytes]
    conv:
      {
        lakhs/cumm: 100,
        lakh/cumm: 100,
        lac/cumm: 100,
        /cumm: 0.001,
        /ul: 0.001,
        /mm3: 0.001,
        10^9/l: 1,
        thou/cumm: 1,
        thousand/cumm: 1,
        k/ul: 1,
