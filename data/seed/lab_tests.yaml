      }
    r: [[any, 18, null, 150, 450]]
    src: S5
    ex: 'Platelets are small blood cells that help the blood to clot.'
  - code: RBC
    name: Red blood cell count
    section: CBC
    unit: 10^6/ul
    aliases: [rbc, rbc count, red blood cell count, red cell count, total rbc count, erythrocytes]
    conv: { million/cumm: 1, mill/cumm: 1, 10^12/l: 1, m/ul: 1, x10^6/ul: 1 }
    r: [[m, 18, null, 4.5, 5.9], [f, 18, null, 4.1, 5.1], [any, 18, null, 4.1, 5.9]]
    src: S5
    ex: 'This counts the red blood cells, which carry oxygen.'
  - code: HCT
    name: Haematocrit (PCV)
    section: CBC
    unit: '%'
    aliases: [hct, pcv, packed cell volume, haematocrit, hematocrit]
    conv: {}
    r: [[m, 18, null, 40.0, 52.0], [f, 18, null, 36.0, 46.0], [any, 18, null, 36.0, 52.0]]
    src: S5
    ex: 'Haematocrit is the share of your blood made up of red blood cells.'
  - code: MCV
