# Static reply texts (Hindi). Keep in sync with en.yaml (same keys, same version).
version: reply_templates_v4
texts:
  help: |-
    मैं दवाई साथी हूँ 💊

    मैं ये कर सकता हूँ:
    • पर्ची की फ़ोटो पढ़कर आसान भाषा में समझाना
    • लैब रिपोर्ट समझाना (बीमारी बताना नहीं)
    • उसी साल्ट की सस्ती जेनेरिक दवा सुझाना

    शुरू करने के लिए अपनी पर्ची या लैब रिपोर्ट की साफ़ फ़ोटो भेजें। सारे कमांड देखने के लिए HELP भेजें।

    🚨 इमरजेंसी? 112 या 108 पर कॉल करें।

    मैं डॉक्टर नहीं हूँ। कुछ भी बदलने से पहले अपने डॉक्टर या फ़ार्मासिस्ट से पूछें।
  coming_soon: |-
    आपके संदेश के लिए धन्यवाद! यह सुविधा जल्द आ रही है। अभी मैं क्या कर सकता हूँ, यह जानने के लिए HELP भेजें।
  received_media: |-
    आपकी फ़ाइल मिल गई। उसे पढ़ने की सुविधा बहुत जल्द आ रही है। धैर्य के लिए धन्यवाद!
  emergency.general: |-
    🚨 यह इमरजेंसी लग रही है।

    अभी 112 पर कॉल करें (एम्बुलेंस के लिए 108) या तुरंत नज़दीकी अस्पताल जाएँ। यहाँ जवाब का इंतज़ार न करें।

    मैं डॉक्टर नहीं हूँ और इमरजेंसी में मदद नहीं कर सकता।
  emergency.self_harm: |-
    💛 आप जिस दौर से गुज़र रहे हैं, उसके लिए मुझे सचमुच दुख है। आप अकेले नहीं हैं, और मदद अभी उपलब्ध है।

    Tele-MANAS 14416 पर कॉल करें (मुफ़्त, 24x7, हिन्दी और कई भाषाओं में)। अगर जान को ख़तरा है या कुछ खा लिया है, तो अभी 112 या 108 पर कॉल करें या नज़दीकी अस्पताल जाएँ। कृपया किसी भरोसेमंद व्यक्ति के पास रहें।

    मैं डॉक्टर नहीं हूँ, पर आपकी ज़िंदगी बहुत क़ीमती है।
  out_of_scope: |-
    मैं सिर्फ़ दवाइयों, पर्ची और लैब रिपोर्ट में मदद कर सकता हूँ, इसलिए इस सवाल का जवाब नहीं दे पाऊँगा।

    आप अपनी पर्ची या लैब रिपोर्ट की साफ़ फ़ोटो भेज सकते हैं, या किसी दवाई के बारे में पूछ सकते हैं। मैं क्या-क्या कर सकता हूँ, यह जानने के लिए HELP भेजें।
  greeting: |-
    नमस्ते! 🙏 मैं दवाई साथी हूँ।

    अपनी पर्ची या लैब रिपोर्ट की साफ़ फ़ोटो भेजें, मैं उसे आसान भाषा में समझाऊँगा। सारे कमांड देखने के लिए HELP भेजें।
  rx.lab_report: |-
    यह लैब रिपोर्ट लग रही है। लैब रिपोर्ट समझाने की सुविधा जल्द आ रही है। अभी कृपया अपनी पर्ची की साफ़ फ़ोटो भेजें।
  rx.medicine_strip: |-
    यह दवाई का पत्ता या डिब्बा लग रहा है। कृपया इसकी जगह डॉक्टर की पर्ची की फ़ोटो भेजें; पत्ता पढ़ने की सुविधा बाद में आएगी।
  rx.other: |-
    मैं समझ नहीं पाया कि यह पर्ची है। कृपया पूरी पर्ची की साफ़ फ़ोटो भेजें।

    सुझाव: अच्छी रोशनी, कागज़ मेज़ पर सीधा, पूरा पन्ना फ़ोटो में।
  rx.resend_dark: |-
    फ़ोटो बहुत अँधेरी है, मैं पढ़ नहीं पा रहा। कृपया अच्छी रोशनी में, कागज़ सीधा रखकर, पूरा पन्ना लेते हुए दोबारा भेजें।
  rx.resend_blur: |-
    फ़ोटो बहुत धुंधली है, मैं पढ़ नहीं पा रहा। कृपया फ़ोन स्थिर रखकर, कागज़ सीधा रखकर, पूरा पन्ना लेते हुए दोबारा भेजें।
  rx.resend_contrast: |-
    इस फ़ोटो में लिखावट साफ़ नहीं दिख रही (शायद बहुत तेज़ रोशनी है या लिखावट हल्की है)। कृपया अच्छी रोशनी में पूरा पन्ना लेते हुए दोबारा भेजें।
  rx.unreadable: |-
    इस फ़ोटो से मैं कोई दवाई साफ़ नहीं पढ़ पाया। कृपया पूरे पन्ने की साफ़ फ़ोटो भेजें, या पर्ची अपने फ़ार्मासिस्ट को दिखाएँ।

    सुझाव: अच्छी रोशनी, कागज़ मेज़ पर सीधा, पूरा पन्ना फ़ोटो में।
  rx.needs_review: |-
    मैं यह पर्ची ठीक से नहीं पढ़ पाया, इसलिए अंदाज़ा नहीं लगाऊँगा। कृपया दवाइयाँ अपने फ़ार्मासिस्ट से पक्की करें, या साफ़ फ़ोटो भेजें।
  rx.pdf_encrypted: |-
    यह PDF पासवर्ड से बंद है, इसलिए मैं इसे खोल नहीं सकता। कृपया पर्ची की फ़ोटो या बिना पासवर्ड वाली PDF भेजें।
  rx.bad_file: |-
    मैं यह फ़ाइल खोल नहीं पाया। कृपया पर्ची की साफ़ फ़ोटो (JPG या PNG) या सामान्य PDF भेजें।
  rx.pdf_too_long: |-
    इस PDF में पर्ची के लिए बहुत ज़्यादा पन्ने हैं। कृपया सिर्फ़ पर्ची वाला पन्ना फ़ोटो या छोटी PDF में भेजें।
  generic_query_ask_name: |-
    आप किस दवाई का जेनेरिक जानना चाहते हैं? उसका नाम भेजें, जैसे: "Dolo 650 ka generic batao"।
  generic_query_unavailable: |-
    अभी मैं दवाइयों की सूची नहीं देख पा रहा। कृपया थोड़ी देर बाद फिर कोशिश करें।
