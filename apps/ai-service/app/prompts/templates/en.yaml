# Static reply texts (English). Keep in sync with hi.yaml (same keys, same version).
version: reply_templates_v4
texts:
  help: |-
    I'm Dawai Saathi 💊

    I can:
    • Read a prescription photo and explain it simply
    • Explain a lab report (never a diagnosis)
    • Suggest cheaper generics with the same salt

    Send a clear photo of your prescription or lab report to start. Send HELP to see all commands.

    🚨 Emergency? Call 112 or 108.

    I am not a doctor. Always ask your doctor or pharmacist before changing anything.
  coming_soon: |-
    Thanks for your message! This feature is coming soon. For now, send HELP to see what I can do.
  received_media: |-
    I received your file. Reading it will be available very soon. Thank you for your patience!
  emergency.general: |-
    🚨 This sounds like an emergency.

    Call 112 now (108 for an ambulance) or go to the nearest hospital immediately. Do not wait for a reply here.

    I am not a doctor and cannot help in an emergency.
  emergency.self_harm: |-
    💛 I am really sorry you are going through this. You are not alone, and help is available right now.

    Call Tele-MANAS 14416 (free, 24x7, in Hindi and many other languages). If you are in immediate danger or have taken something, call 112 or 108 now or go to the nearest hospital. Please stay with someone you trust.

    I am not a doctor, but your life matters.
  out_of_scope: |-
    I can only help with medicines, prescriptions and lab reports, so I cannot answer that.

    You can send a clear photo of your prescription or lab report, or ask me about a medicine. Send HELP to see everything I can do.
  greeting: |-
    Namaste! 🙏 I am Dawai Saathi.

    Send a clear photo of your prescription or lab report and I will explain it in simple words. Send HELP to see all commands.
  rx.lab_report: |-
    This looks like a lab report. Lab report explanations are coming soon. For now, please send a clear photo of your prescription.
  rx.medicine_strip: |-
    This looks like a medicine strip or box. Please send a photo of the doctor's prescription instead; reading strips will come later.
  rx.other: |-
    I could not tell that this is a prescription. Please send a clear photo of the whole prescription page.

    Tips: good light, paper flat on a table, the whole page in the frame.
  rx.resend_dark: |-
    The photo is too dark for me to read. Please send it again in good light, with the paper flat and the whole page in the frame.
  rx.resend_blur: |-
    The photo is too blurry for me to read. Please hold the phone steady, keep the paper flat and send it again with the whole page in the frame.
  rx.resend_contrast: |-
    I cannot see the writing clearly in this photo (it may be too bright or too faded). Please send it again in good light with the whole page in the frame.
  rx.unreadable: |-
    I could not read any medicine clearly from this photo. Please send a clearer photo of the whole page, or show the prescription to your pharmacist.

    Tips: good light, paper flat on a table, the whole page in the frame.
  rx.needs_review: |-
    I could not read this prescription properly, so I will not guess. Please confirm the medicines with your pharmacist, or send a clearer photo.
  rx.pdf_encrypted: |-
    This PDF is password protected, so I cannot open it. Please send a photo of the prescription or a PDF without a password.
  rx.bad_file: |-
    I could not open this file. Please send a clear photo (JPG or PNG) or a normal PDF of the prescription.
  rx.pdf_too_long: |-
    This PDF has too many pages for a prescription. Please send only the prescription page as a photo or a short PDF.
  generic_query_ask_name: |-
    Which medicine do you want a generic for? Send its name, for example: "Dolo 650 ka generic batao".
  generic_query_unavailable: |-
    I cannot check my medicine list right now. Please try again in a little while.
