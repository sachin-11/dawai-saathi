[project]
name = "dawai-ai-service"
version = "0.0.0"
description = "Dawai Saathi AI service — stateless LangGraph pipeline (FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6",
    "asyncpg>=0.32",
    "en-core-web-sm",
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "langfuse>=5.2",
    "openai>=3.46",
    "pillow>=13.0.0",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.15.1",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "N",             # pep8-naming
  "S",             # bandit (security)
  "ASYNC",         # async pitfalls
  "C4", "SIM", "RET", "PTH", "RUF",
  "ANN",           # type annotations everywhere
  "T20",           # no print()
]
ignore = ["ANN401", "E501"]  # the formatter wraps code; long docstrings and comments are fine

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# asserts and dummy test tokens are fine in tests
"tests/**" = ["S101", "S105", "S106", "S608", "E501", "ANN"]
# Indian prescriptions use en/em dashes in patterns like "1–0–1"; the lookalikes are intended.
"app/tools/rx_validate.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true  # no type stubs published

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Settings are populated from env (AliasChoices), never via typed __init__ kwargs.
warn_required_dynamic_aliases = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers -m 'not integration'"
markers = [
  "integration: needs real Postgres (docker-compose.test.yml); run with `pytest -m integration`",
]
