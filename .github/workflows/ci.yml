name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: gateway (lint · typecheck · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm # caches the pnpm store keyed on pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check (root)
        run: pnpm format:check

      - name: Lint
        run: pnpm --filter @dawai/gateway lint

      - name: Typecheck
        run: pnpm --filter @dawai/gateway typecheck

      - name: Test (unit + e2e)
        run: pnpm --filter @dawai/gateway test

      - name: Build
        run: pnpm --filter @dawai/gateway build

  ai-service:
    name: ai-service (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12' # keep in sync with .python-version
          enable-cache: true # caches the uv cache keyed on uv.lock
          cache-dependency-glob: apps/ai-service/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      # Safety gate (M6): recall on the emergency set must be 100% (rules stage on keyword rows,
      # rules + fake classifier on all positives). The report is kept as a build artifact.
      - name: Emergency eval (rules, then rules + fake classifier)
        run: |
          uv run python ../../evals/run_emergency_eval.py --mode rules
          uv run python ../../evals/run_emergency_eval.py --mode fake

      # Safety gates (M7, M8): prescription replay and the drug matcher / generic finder. Hard gates:
      # zero wrong-strength, wrong-form/release, wrong-salt and forbidden generic suggestions.
      - name: Prescription eval and drug matcher eval (offline)
        run: |
          uv run python ../../evals/scripts/make_synthetic_rx.py
          uv run python ../../evals/run_rx_eval.py --mode fake
          uv run python ../../evals/run_rx_eval.py --mode fake-noisy
          uv run python ../../evals/run_matcher_eval.py
          uv run python ../../evals/run_interaction_eval.py
          uv run python ../../evals/scripts/make_synthetic_lab.py
          uv run python ../../evals/run_lab_eval.py --mode fake
          uv run python ../../evals/run_lab_eval.py --mode fake-noisy
          uv run python ../../evals/run_voice_eval.py --mode fake
          uv run python ../../evals/run_voice_eval.py --mode fake-noisy
          uv run python ../../evals/run_pipeline_comparison.py --no-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            evals/reports/*emergency*.md
            evals/reports/*rx*.md
            evals/reports/*drug-matcher*.md
            evals/reports/*voice*.md
          if-no-files-found: ignore

  integration:
    name: integration (postgres · redis · minio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gateway, ai-service]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dawai
          POSTGRES_PASSWORD: dawai
          POSTGRES_DB: dawai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawai -d dawai_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Same variable names the tests read locally (see apps/gateway/test/integration/infra.int-spec.ts).
      DATABASE_URL: postgresql://dawai:dawai@localhost:5432/dawai_test
      INTEGRATION_DATABASE_URL: postgresql://dawai:dawai@localhost:5432/dawai_test
      INTEGRATION_AI_DATABASE_URL: postgresql://dawai_ai_ro:dawai_ai_ro@localhost:5432/dawai_test
      INTEGRATION_REDIS_URL: redis://localhost:6379
      INTEGRATION_S3_ENDPOINT: http://localhost:9000
      INTEGRATION_S3_BUCKET: dawai-media-test
      INTEGRATION_S3_ACCESS_KEY_ID: dawai-minio
      INTEGRATION_S3_SECRET_ACCESS_KEY: dawai-minio-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock

      - name: Install (node)
        run: pnpm install --frozen-lockfile

      - name: Install (python)
        run: uv sync --frozen
        working-directory: apps/ai-service

      # Service containers can't take a command, so MinIO is started with docker run.
      - name: Start MinIO and create the test bucket
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=dawai-minio -e MINIO_ROOT_PASSWORD=dawai-minio-secret \
            -e MINIO_KMS_SECRET_KEY=dawai-local-key:ZGF3YWktbG9jYWwtbWluaW8ta21zLWtleS0wMDAwMDA= \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            docker exec minio mc ready local && break
            sleep 1
          done
          docker exec -e BUCKETS=dawai-media-test -e EXPIRE_DAYS=1 -e EXPIRE_BUCKETS=dawai-media-test \
            -e MINIO_ENDPOINT=http://localhost:9000 -e MINIO_USER=dawai-minio -e MINIO_PASSWORD=dawai-minio-secret \
            -i minio /bin/sh < infra/docker/minio/init.sh

      # Same script docker-compose runs on first boot: creates the read-only dawai_ai_ro role.
      - name: Create read-only AI role
        run: sh infra/docker/postgres/init/02-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: dawai
          POSTGRES_USER: dawai
          POSTGRES_DB: dawai_test
          AI_RO_PASSWORD: dawai_ai_ro

      - name: Apply migrations
        run: pnpm --filter @dawai/gateway exec prisma migrate deploy

      - name: Gateway integration tests
        run: pnpm --filter @dawai/gateway run test:integration

      - name: AI service integration tests
        run: pnpm --filter @dawai/ai-service run test:integration

      # Contract-first (M5): the committed OpenAPI file and the generated TypeScript types must match
      # what the AI service code produces today. Fails when someone changed a schema without `make contracts`.
      - name: Contracts are up to date
        run: |
          make contracts
          git diff --exit-code -- packages/contracts apps/gateway/src/ai-client/generated \
            apps/gateway/src/common/safety/data apps/ai-service/app/safety/data

      # The production image boots in fake LLM mode and answers /v1/process (no API keys needed).
      - name: AI service image smoke test
        run: |
          docker build -f infra/docker/ai-service.Dockerfile -t dawai/ai-service:ci .
          docker run -d --name ai-ci -p 8120:8000 -e SERVICE_TOKEN=ci-token -e NODE_ENV=development \
            -e LLM_MODE=fake -e DATABASE_URL=postgresql://dawai_ai_ro:dawai_ai_ro@172.17.0.1:5432/dawai_test \
            dawai/ai-service:ci
          for i in $(seq 1 30); do curl -sf localhost:8120/health/live && break; sleep 1; done
          curl -sf -X POST localhost:8120/v1/process -H 'X-Service-Token: ci-token' -H 'content-type: application/json' \
            -d '{"request_id":"ci","user":{"language":"en"},"input":{"type":"text","text":"what can you do"}}' | grep -q '"intent"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8120/v1/process -H 'content-type: application/json' -d '{}')" = 401
          # an emergency is answered by the keyword rules with 112 / 108 and no model call
          curl -sf -X POST localhost:8120/v1/process -H 'X-Service-Token: ci-token' -H 'content-type: application/json' \
            -d '{"request_id":"ci2","user":{"language":"en"},"input":{"type":"text","text":"my father has chest pain"}}' | grep -q '"emergency":true'
